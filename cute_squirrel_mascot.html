<!DOCTYPE html>
<html>
<head>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a1008;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden; font-family: sans-serif;
}
.scene {
  position: relative; width: 100%; max-width: 680px; height: 540px;
  display: flex; align-items: center; justify-content: center;
}
.snowflake {
  position: absolute; color: #fff; font-size: 14px; opacity: 0;
  animation: snowFall linear infinite;
  pointer-events: none;
}
@keyframes snowFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 0.6; }
  100% { transform: translateY(560px) rotate(360deg); opacity: 0; }
}
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
  background: #e8f4f8; border-radius: 40% 40% 0 0;
}
.ground-snow {
  position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
  background: #f0f8ff; border-radius: 50% 50% 0 0;
}
.char-wrap {
  position: relative; display: flex; flex-direction: column; align-items: center; z-index: 10;
  cursor: pointer;
}
.squirrel { position: relative; width: 200px; height: 280px; }

.tail {
  position: absolute; bottom: 30px; right: -30px;
  width: 90px; height: 180px;
  background: #b85c1a;
  border-radius: 80% 80% 30% 80%;
  transform-origin: bottom left;
  animation: tailWag 1.8s ease-in-out infinite;
  z-index: 1;
}
.tail-inner {
  position: absolute; top: 10px; left: 8px;
  width: 68px; height: 150px;
  background: #d4845e;
  border-radius: 80% 80% 30% 80%;
}
.tail-tip {
  position: absolute; top: 5px; left: 12px;
  width: 48px; height: 110px;
  background: #f0cba0;
  border-radius: 80% 80% 30% 80%;
  opacity: 0.8;
}
@keyframes tailWag {
  0%,100% { transform: rotate(-5deg) scaleX(1); }
  40% { transform: rotate(18deg) scaleX(0.9); }
  60% { transform: rotate(18deg) scaleX(0.9); }
}

.body {
  position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 130px;
  background: #b85c1a;
  border-radius: 50% 50% 44% 44% / 55% 55% 45% 45%;
  z-index: 3;
  animation: bodyBob 1.8s ease-in-out infinite;
}
.belly {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  width: 66px; height: 80px;
  background: #f5dbb8;
  border-radius: 50%;
  z-index: 4;
}
@keyframes bodyBob {
  0%,100% { transform: translateX(-50%) translateY(0); }
  45% { transform: translateX(-50%) translateY(-12px); }
}

.head {
  position: absolute; top: 70px; left: 50%;
  transform: translateX(-50%);
  width: 115px; height: 108px;
  background: #b85c1a;
  border-radius: 55% 55% 48% 48% / 60% 60% 42% 42%;
  z-index: 5;
  animation: headBob 1.8s ease-in-out infinite;
}
@keyframes headBob {
  0%,100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  45% { transform: translateX(-50%) translateY(-12px) rotate(-1.5deg); }
}

.head-fur {
  position: absolute; top: -18px; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 40px;
  background: #8b3d0a;
  border-radius: 60% 60% 0 0;
  z-index: 4;
}

.ear {
  position: absolute; top: -14px;
  width: 36px; height: 46px;
  background: #8b3d0a;
  border-radius: 50% 50% 40% 40%;
  z-index: 4;
}
.ear.left { left: 6px; transform: rotate(-12deg); }
.ear.right { right: 6px; transform: rotate(12deg); }
.ear-inner {
  position: absolute; top: 6px; left: 6px;
  width: 22px; height: 30px;
  background: #e8a0a0;
  border-radius: 50% 50% 40% 40%;
}

.face { position: relative; z-index: 6; }

.eyes-row {
  position: absolute; top: 22px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 20px; z-index: 8;
}
.eye-socket {
  width: 36px; height: 38px;
  background: white;
  border-radius: 50%;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  position: relative;
  overflow: visible;
  animation: eyeBlink 3.5s ease-in-out infinite;
}
@keyframes eyeBlink {
  0%,88%,100% { transform: scaleY(1); }
  93% { transform: scaleY(0.06); }
}
.pupil {
  position: absolute;
  width: 20px; height: 22px;
  background: #1a0a00;
  border-radius: 50%;
  top: 7px; left: 8px;
  transition: transform 0.15s;
}
.pupil::after {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  background: white;
  border-radius: 50%;
  top: 2px; right: 2px;
}
.pupil::before {
  content: '';
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  bottom: 4px; left: 3px;
}
.eye-shine {
  position: absolute; top: 3px; right: 4px;
  width: 10px; height: 5px;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
  transform: rotate(-30deg);
  z-index: 9;
}

.nose-area {
  position: absolute; top: 54px; left: 50%;
  transform: translateX(-50%);
  z-index: 8;
}
.snout {
  width: 52px; height: 34px;
  background: #f5dbb8;
  border-radius: 50%;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.nose {
  width: 16px; height: 11px;
  background: #2a1a08;
  border-radius: 50%;
  position: absolute; top: 4px;
}
.nose::after {
  content: '';
  position: absolute; bottom: -1px; left: 50%;
  transform: translateX(-50%);
  width: 5px; height: 5px;
  background: #2a1a08;
  clip-path: polygon(50% 100%, 0 0, 100% 0);
}

.cheeks { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: 100px; display: flex; justify-content: space-between; z-index: 7; }
.cheek { width: 22px; height: 12px; background: rgba(220,80,80,0.3); border-radius: 50%; }

.mouth {
  position: absolute; top: 82px; left: 50%;
  transform: translateX(-50%);
  width: 38px; height: 16px;
  background: #3a1a08;
  border-radius: 0 0 20px 20px;
  z-index: 8;
  overflow: hidden;
  transition: all 0.3s;
}
.tongue-sq {
  position: absolute; bottom: 1px; left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 10px;
  background: #e86080;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
}

.teeth-sq {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 2px;
}
.tooth {
  width: 10px; height: 14px;
  background: #fffef5;
  border-radius: 0 0 4px 4px;
  border: 0.5px solid #ddd;
}

.arm {
  position: absolute; width: 28px; height: 60px;
  background: #b85c1a;
  border-radius: 40% 40% 50% 50%;
  z-index: 2;
  top: 100px;
}
.arm.left { left: 12px; transform: rotate(15deg); transform-origin: top center; animation: armL 1.8s ease-in-out infinite; }
.arm.right { right: 12px; transform: rotate(-15deg); transform-origin: top center; animation: armR 1.8s ease-in-out infinite; }
@keyframes armL {
  0%,100% { transform: rotate(15deg); }
  45% { transform: rotate(30deg); }
}
@keyframes armR {
  0%,100% { transform: rotate(-15deg); }
  45% { transform: rotate(-30deg); }
}

.paw {
  position: absolute; bottom: -10px; left: 50%;
  transform: translateX(-50%);
  width: 26px; height: 18px;
  background: #f5dbb8;
  border-radius: 50%;
}

.acorn {
  position: absolute; bottom: -5px; right: -16px;
  font-size: 28px;
  animation: acornBob 1.8s ease-in-out infinite;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  z-index: 12;
}
@keyframes acornBob {
  0%,100% { transform: rotate(-8deg) translateY(0); }
  45% { transform: rotate(4deg) translateY(-12px); }
}

.leg { position: absolute; bottom: -10px; width: 26px; height: 40px; background: #8b3d0a; border-radius: 40%; z-index: 3; }
.leg.left { left: 22px; }
.leg.right { right: 22px; }
.foot { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 32px; height: 16px; background: #6b2d06; border-radius: 50%; }

.shadow-sq {
  width: 90px; height: 16px;
  background: rgba(0,0,0,0.25);
  border-radius: 50%;
  margin-top: 6px;
  animation: shadowPulse 1.8s ease-in-out infinite;
  filter: blur(2px);
}
@keyframes shadowPulse {
  0%,100% { transform: scaleX(1); opacity: 0.6; }
  45% { transform: scaleX(0.7); opacity: 0.3; }
}

.emotion-bub {
  position: absolute; top: -52px; right: -24px;
  background: white; border-radius: 14px;
  padding: 6px 12px; font-size: 22px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  opacity: 0; transform: scale(0.5);
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 20;
}
.emotion-bub.show { opacity: 1; transform: scale(1); }
.emotion-bub::after {
  content: ''; position: absolute; bottom: -7px; left: 18px;
  width: 12px; height: 12px; background: white;
  transform: rotate(45deg); border-radius: 2px;
}

.xp-pop {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #f5a623, #e8821e);
  color: white; font-weight: 800; font-size: 17px;
  padding: 4px 14px; border-radius: 20px;
  box-shadow: 0 4px 10px rgba(232,130,30,0.45);
  opacity: 0; pointer-events: none; z-index: 30;
}

.star-burst { position: absolute; font-size: 16px; opacity: 0; pointer-events: none; z-index: 25; }

.controls {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  margin-top: 18px; z-index: 10; padding: 0 12px;
}
.emo-btn {
  padding: 7px 14px; border: none; border-radius: 20px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  color: white; transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}
.emo-btn:hover { transform: translateY(-2px) scale(1.05); }
.emo-btn:active { transform: scale(0.95); }
.b1 { background: linear-gradient(135deg, #e8821e, #c85a08); }
.b2 { background: linear-gradient(135deg, #e85580, #c02050); }
.b3 { background: linear-gradient(135deg, #4a9ae8, #1a6ac0); }
.b4 { background: linear-gradient(135deg, #f0c020, #c89000); }
.b5 { background: linear-gradient(135deg, #70b845, #3a8015); }
.b6 { background: linear-gradient(135deg, #a060e0, #6030b0); }
.b7 { background: linear-gradient(135deg, #40c8e8, #1090b8); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="ground"><div class="ground-snow"></div></div>

  <div class="char-wrap" id="charWrap" onclick="onTap()">
    <div class="squirrel" id="sqrl">
      <div class="emotion-bub" id="emoBub">🌰</div>
      <div class="xp-pop" id="xpPop">+10 XP</div>

      <div class="tail">
        <div class="tail-inner"><div class="tail-tip"></div></div>
      </div>

      <div class="leg left"><div class="foot"></div></div>
      <div class="leg right"><div class="foot"></div></div>

      <div class="body" id="bodyEl">
        <div class="belly"></div>
        <div class="arm left"><div class="paw"></div></div>
        <div class="arm right">
          <div class="paw"></div>
          <div class="acorn">🌰</div>
        </div>
      </div>

      <div class="head" id="headEl">
        <div class="head-fur"></div>
        <div class="ear left"><div class="ear-inner"></div></div>
        <div class="ear right"><div class="ear-inner"></div></div>

        <div class="eyes-row">
          <div class="eye-socket" id="eyeL">
            <div class="eye-shine"></div>
            <div class="pupil" id="pupilL"></div>
          </div>
          <div class="eye-socket" id="eyeR">
            <div class="eye-shine"></div>
            <div class="pupil" id="pupilR"></div>
          </div>
        </div>

        <div class="cheeks">
          <div class="cheek"></div>
          <div class="cheek"></div>
        </div>

        <div class="nose-area">
          <div class="snout">
            <div class="nose"></div>
          </div>
        </div>

        <div class="mouth" id="mouthEl">
          <div class="teeth-sq"><div class="tooth"></div><div class="tooth"></div></div>
          <div class="tongue-sq" id="tongueSq"></div>
        </div>
      </div>
    </div>
    <div class="shadow-sq"></div>
  </div>
</div>

<div class="controls">
  <button class="emo-btn b1" onclick="setEmo('happy')">😊 Happy</button>
  <button class="emo-btn b2" onclick="setEmo('love')">💕 Love</button>
  <button class="emo-btn b3" onclick="setEmo('scared')">😱 Scared</button>
  <button class="emo-btn b4" onclick="setEmo('winner')">🏆 Winner</button>
  <button class="emo-btn b5" onclick="setEmo('nom')">🌰 Nom nom</button>
  <button class="emo-btn b6" onclick="setEmo('zoomies')">💨 Zoomies</button>
  <button class="emo-btn b7" onclick="triggerXP()">⚡ +XP</button>
</div>

<script>
const sqrl = document.getElementById('sqrl');
const headEl = document.getElementById('headEl');
const bodyEl = document.getElementById('bodyEl');
const mouthEl = document.getElementById('mouthEl');
const tongueSq = document.getElementById('tongueSq');
const emoBub = document.getElementById('emoBub');
const xpPop = document.getElementById('xpPop');
const scene = document.getElementById('scene');
let bubTimer;
let taps = 0;

const xpMsgs = ['+10 XP ⚡','+25 XP 🌰','+50 XP 🔥','COMBO! 🎯','ACE! 🏆'];

function showBub(txt, dur=2000) {
  clearTimeout(bubTimer);
  emoBub.textContent = txt;
  emoBub.classList.add('show');
  bubTimer = setTimeout(() => emoBub.classList.remove('show'), dur);
}

function flashXP() {
  const msg = xpMsgs[Math.min(taps, xpMsgs.length-1)];
  xpPop.textContent = msg;
  xpPop.style.animation = 'none';
  void xpPop.offsetWidth;
  xpPop.style.animation = 'xpAnim 1.1s ease-out forwards';
}

function burstStars(count=6) {
  const emojis = ['⭐','✨','💫','🌟','❄️'];
  for (let i=0;i<count;i++) {
    const s = document.createElement('div');
    s.className = 'star-burst';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.cssText = `top:${20+Math.random()*60}%;left:${10+Math.random()*80}%;animation:starPop 0.8s ease-out ${i*0.07}s forwards`;
    scene.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

function spawnSnow() {
  for (let i=0;i<8;i++) {
    const f = document.createElement('div');
    f.className = 'snowflake';
    f.textContent = '❄';
    f.style.cssText = `left:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s`;
    scene.appendChild(f);
    setTimeout(() => f.remove(), 5000);
  }
}

function resetAnims() {
  headEl.style.animation = 'headBob 1.8s ease-in-out infinite';
  bodyEl.style.animation = 'bodyBob 1.8s ease-in-out infinite';
  sqrl.style.animation = '';
  mouthEl.style.width = '38px';
  mouthEl.style.height = '16px';
  mouthEl.style.borderRadius = '0 0 20px 20px';
  mouthEl.style.background = '#3a1a08';
  tongueSq.style.display = 'block';
  document.querySelectorAll('.eye-socket').forEach(e => { e.style.transform = 'scaleY(1)'; e.style.width='36px'; e.style.height='38px'; });
  document.querySelectorAll('.pupil').forEach(p => p.style.transform = '');
  document.querySelectorAll('.ear').forEach(e => e.style.background = '#8b3d0a');
}

function setEmo(type) {
  resetAnims();
  if (type === 'happy') {
    showBub('🌰😊✨');
    burstStars(5);
    mouthEl.style.width = '44px'; mouthEl.style.height = '20px';
    sqrl.style.animation = 'sqBounce 0.5s ease-out 2';
  }
  else if (type === 'love') {
    showBub('💕🥰💖', 2200);
    mouthEl.style.height = '12px';
    document.querySelectorAll('.eye-socket').forEach(e => e.style.transform = 'scaleY(0.55)');
    sqrl.style.animation = 'heartbeat 0.8s ease-in-out 3';
    burstStars(4);
  }
  else if (type === 'scared') {
    showBub('😱❄️💨', 2000);
    document.querySelectorAll('.eye-socket').forEach(e => { e.style.width='42px'; e.style.height='44px'; });
    mouthEl.style.width = '46px'; mouthEl.style.height = '22px';
    mouthEl.style.borderRadius = '50%';
    sqrl.style.animation = 'sqShake 0.4s ease-in-out 3';
  }
  else if (type === 'winner') {
    showBub('🏆🌟🎉', 2500);
    burstStars(8);
    mouthEl.style.width = '52px'; mouthEl.style.height = '24px';
    headEl.style.animation = 'headBob 0.6s ease-in-out infinite';
    sqrl.style.animation = 'sqBounce 0.4s ease-out 4';
    flashXP();
  }
  else if (type === 'nom') {
    showBub('🌰😋😌', 2000);
    mouthEl.style.width = '28px'; mouthEl.style.height = '14px';
    headEl.style.animation = 'nomAnim 0.3s ease-in-out 6';
  }
  else if (type === 'zoomies') {
    showBub('💨💨🌀', 1800);
    headEl.style.animation = 'headBob 0.3s ease-in-out infinite';
    bodyEl.style.animation = 'bodyBob 0.3s ease-in-out infinite';
    mouthEl.style.width = '50px'; mouthEl.style.height = '22px';
    document.querySelectorAll('.eye-socket').forEach(e => { e.style.width='38px'; e.style.height='40px'; });
    burstStars(6);
    setTimeout(() => {
      headEl.style.animation = 'headBob 1.8s ease-in-out infinite';
      bodyEl.style.animation = 'bodyBob 1.8s ease-in-out infinite';
    }, 1500);
  }
}

function onTap() {
  taps++;
  setEmo('happy');
  spawnSnow();
}

function triggerXP() {
  taps++;
  flashXP();
  burstStars(5);
  showBub('⚡🌟');
}

document.addEventListener('mousemove', e => {
  const r = sqrl.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const ang = Math.atan2(dy, dx);
  const d = Math.min(5, Math.hypot(dx, dy)/50);
  const ox = Math.cos(ang)*d, oy = Math.sin(ang)*d;
  document.querySelectorAll('.pupil').forEach(p => {
    p.style.transform = `translate(${ox}px,${oy}px)`;
  });
});

setInterval(() => {
  if (Math.random() > 0.55) spawnSnow();
  if (Math.random() > 0.7) showBub(['🌰','❄️','😄','✨','🎵'][Math.floor(Math.random()*5)], 1200);
}, 4000);

setTimeout(() => setEmo('happy'), 500);

const styleEl = document.createElement('style');
styleEl.textContent = `
@keyframes sqBounce { 0%,100%{transform:translateY(0)}35%{transform:translateY(-28px)}65%{transform:translateY(-14px)} }
@keyframes heartbeat { 0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%{transform:scale(1)} }
@keyframes sqShake { 0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)rotate(-3deg)}40%{transform:translateX(9px)rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)} }
@keyframes nomAnim { 0%,100%{transform:translateX(-50%)translateY(0)}50%{transform:translateX(-50%)translateY(3px)} }
@keyframes starPop { 0%{opacity:0;transform:translate(-50%,-50%)scale(0)rotate(0)} 40%{opacity:1;transform:translate(-50%,-50%)scale(1.3)rotate(180deg)} 100%{opacity:0;transform:translate(-50%,-50%)scale(0.6)rotate(360deg)translateY(-50px)} }
@keyframes xpAnim { 0%{opacity:0;transform:translateX(-50%)translateY(0)scale(0.5)} 25%{opacity:1;transform:translateX(-50%)translateY(-10px)scale(1.15)} 75%{opacity:1;transform:translateX(-50%)translateY(-22px)scale(1)} 100%{opacity:0;transform:translateX(-50%)translateY(-42px)scale(0.8)} }
`;
document.head.appendChild(styleEl);
</script>
</body>
</html>
